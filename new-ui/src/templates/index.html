<!DOCTYPE html>
<html lang="en" class="h-full">
    <%- include('partials/head.html') %>
    <body class="m-0 overflow-hidden select-none h-full">
        <section x-data="app" class="h-full">
            <% Object.keys(screens).forEach(function(screen) { %>
            <section x-show="template === '<%= screen %>'" class="h-full museo" :class="bodyClassPicker(currentScreen)">
                <%- screens[screen] %>
            </section>
            <% }); %>
        </section>
    <%- include('partials/scripts.html') %>
    </body>
</html>
